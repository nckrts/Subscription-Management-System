version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: billing_postgres
    restart: always
    environment:
      POSTGRES_USER: billing_user
      POSTGRES_PASSWORD: billing_password
      POSTGRES_DB: billing_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: billing_rabbitmq
    restart: always
    ports:
      - '5672:5672'
      - '15672:15672'

  prometheus:
    image: prom/prometheus:latest
    container_name: billing_prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:latest
    container_name: billing_grafana
    restart: always
    ports:
      - '3001:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  postgres_data:
